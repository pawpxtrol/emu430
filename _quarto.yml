project:
  type: website
  output-dir: _site
  # Only build the website pages by default. report.qmd is rendered
  # explicitly to docx via:  quarto render report.qmd --to docx
  render:
    - index.qmd
    - data.qmd
    - analysis.qmd
  resources:
    - data/feeding_clean.RData

website:
  title: "Paw Patrol — Street animal feeding (Ankara)"
  # GitHub org pawpxtrol / repo emu430 (Pages URL uses org name)
  site-url: https://pawpxtrol.github.io/emu430/
  repo-url: https://github.com/pawpxtrol/emu430
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: data.qmd
        text: Data
      - href: analysis.qmd
        text: Analysis

format:
  html:
    theme: cosmo
    toc: true
    code-fold: true
    code-tools: true
    link-external-newwindow: true

execute:
  echo: true
  warning: false
  message: false

lang: en
