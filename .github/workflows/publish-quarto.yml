# Build Quarto site, push _site/ to gh-pages branch (classic Pages flow).
# Works when "GitHub Actions" Pages source + deploy-pages fails (common on orgs / OIDC).

name: Publish Quarto site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::stringr
            any::readr
            any::here
            any::ggplot2
            any::scales
            any::lubridate
            any::knitr
            any::rmarkdown

      - name: Render site
        run: quarto render

      - name: Verify site output
        run: test -d _site && test -n "$(ls -A _site 2>/dev/null)" || (echo "_site missing or empty" && exit 1)

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
