# Build Quarto site, push _site/ to gh-pages branch (classic Pages flow).
# Works when "GitHub Actions" Pages source + deploy-pages fails (common on orgs / OIDC).

name: Publish Quarto site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::stringr
            any::readr
            any::here
            any::purrr
            any::ggplot2
            any::scales
            any::lubridate
            any::ggrepel
            any::knitr
            any::rmarkdown

      - name: Prepare data (feeding_clean.RData)
        run: Rscript R/prepare_data.R

      - name: Render site
        run: quarto render --no-cache

      - name: Verify site output
        run: |
          echo "Contents of _site:"
          ls _site/
          test -f _site/index.html || (echo "ERROR: _site/index.html missing" && exit 1)

      - name: Render Word report (report.docx)
        run: quarto render report.qmd --to docx --no-cache

      - name: Verify report.docx
        run: |
          ls -la report.docx
          test -f report.docx || (echo "ERROR: report.docx missing" && exit 1)

      - name: Upload report.docx as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-docx
          path: report.docx
          if-no-files-found: error
          retention-days: 30

      - name: Stage report.docx for gh-pages download link
        run: cp report.docx _site/report.docx

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
