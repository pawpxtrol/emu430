# Render Quarto → _site, deploy via GitHub Pages (Actions source).
#
# REQUIRED on GitHub: Settings → Pages → Build and deployment → Source → GitHub Actions
# (NOT "Deploy from a branch".) First deploy may ask you to approve the `github-pages` environment.

name: Publish Quarto site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: quarto-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      # Minimal packages (faster than full tidyverse; matches prepare_data.R + analysis.qmd)
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::stringr
            any::readr
            any::here
            any::ggplot2
            any::scales
            any::lubridate
            any::knitr
            any::rmarkdown

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
